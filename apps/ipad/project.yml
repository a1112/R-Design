name: RDesign
options:
  bundleIdPrefix: dev.rdesign
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    TARGETED_DEVICE_FAMILY: '2'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
targets:
  RDesign:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rdesign.ipad
        INFOPLIST_FILE: Info.plist
        SUPPORTS_MACCATALYST: NO
  RDesignTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: RDesign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rdesign.ipad.tests
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ''
schemes:
  RDesign:
    build:
      targets:
        RDesign: all
    test:
      targets: [RDesignTests]
